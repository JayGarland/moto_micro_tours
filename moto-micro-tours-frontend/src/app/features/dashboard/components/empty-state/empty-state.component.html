<div class="empty-state">
  <div class="empty-state-icon">{{ icon }}</div>
  <h3 class="empty-state-title">{{ title }}</h3>
  <p class="empty-state-description" *ngIf="description">{{ description }}</p>
  <button
    *ngIf="actionLabel"
    type="button"
    class="btn btn-primary"
    (click)="onActionClick()"
  >
    {{ actionLabel }}
  </button>
</div>
