<div class="faq-section">
  <h2 class="section-title">Frequently Asked Questions</h2>

  <mat-accordion class="faq-accordion">
    <mat-expansion-panel *ngFor="let item of faqItems">
      <mat-expansion-panel-header>
        <mat-panel-title>
          {{ item.question }}
        </mat-panel-title>
      </mat-expansion-panel-header>
      <p>{{ item.answer }}</p>
    </mat-expansion-panel>
  </mat-accordion>
</div>
