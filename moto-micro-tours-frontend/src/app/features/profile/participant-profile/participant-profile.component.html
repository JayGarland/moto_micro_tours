<div class="participant-profile-container">
  <!-- Loading State -->
  <div class="loading-container" *ngIf="isLoading()">
    <mat-spinner></mat-spinner>
    <p>Loading participant profile...</p>
  </div>

  <!-- Error State -->
  <div class="error-container" *ngIf="error() && !isLoading()">
    <mat-icon color="warn">error</mat-icon>
    <p class="error-message">{{ error() }}</p>
    <button mat-raised-button color="primary" (click)="goBack()">Go Back</button>
  </div>

  <!-- Profile Content -->
  <div class="profile-content" *ngIf="!isLoading() && !error()">
    <!-- Back Button -->
    <button mat-button (click)="goBack()" class="back-btn">
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>

    <!-- Profile Header -->
    <mat-card class="profile-header-card">
      <div class="profile-header">
        <div class="avatar-section">
          <mat-icon class="avatar-icon">account_circle</mat-icon>
        </div>
        <div class="info-section">
          <h1>{{ participantName() }}</h1>
          <div class="stats">
            <div class="stat-item">
              <mat-icon>star</mat-icon>
              <span class="stat-value">{{ averageRating | number:'1.1-1' }}</span>
              <span class="stat-label">Average Rating</span>
            </div>
            <div class="stat-item">
              <mat-icon>rate_review</mat-icon>
              <span class="stat-value">{{ reviewCount }}</span>
              <span class="stat-label">Reviews</span>
            </div>
          </div>
        </div>
      </div>
    </mat-card>

    <!-- Reviews Section -->
    <div class="reviews-section">
      <h2>Reviews ({{ reviewCount }})</h2>

      <div class="loading-reviews" *ngIf="isLoadingReviews()">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Loading reviews...</p>
      </div>

      <div class="reviews-empty" *ngIf="!isLoadingReviews() && reviewCount === 0">
        <mat-icon>rate_review</mat-icon>
        <p>No reviews yet</p>
      </div>

      <div class="reviews-list" *ngIf="!isLoadingReviews() && reviewCount > 0">
        <app-review-card
          *ngFor="let review of reviews()"
          [review]="review"
        ></app-review-card>
      </div>
    </div>
  </div>
</div>
